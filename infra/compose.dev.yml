services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlchess
      POSTGRES_PASSWORD: mlchess_dev
      POSTGRES_DB: mlchess
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlchess -d mlchess"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "56379:6379"

volumes:
  postgres_data:
  redis_data:
