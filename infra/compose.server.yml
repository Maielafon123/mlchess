name: mlchess
x-backend-env: &backend-env
  MLCHESS_ENVIRONMENT: production
  MLCHESS_PUBLIC_ORIGIN: ${MLCHESS_PUBLIC_ORIGIN:?Required HTTPS origin}
  MLCHESS_DEV_AUTH_ENABLED: "false"
  MLCHESS_INVITATION_SECRET: ${MLCHESS_INVITATION_SECRET:?Required}
  MLCHESS_DATABASE_URL: postgresql+asyncpg://mlchess:${POSTGRES_PASSWORD:?Required}@postgres:5432/mlchess
x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment:
      POSTGRES_USER: mlchess
      POSTGRES_DB: mlchess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mlchess -d mlchess"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *runtime
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    user: "999:999"
    mem_limit: 96m
    cpus: 0.1
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Required}
    command: [sh, -ec, 'exec redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *runtime
    restart: "no"
    image: mlchess-api:${MLCHESS_IMAGE_TAG:?Set an exact release SHA}
    build: {context: .., dockerfile: infra/Dockerfile.backend, target: api}
    mem_limit: 256m
    cpus: 0.5
    environment: *backend-env
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *runtime
    image: mlchess-api:${MLCHESS_IMAGE_TAG:?Required}
    build: {context: .., dockerfile: infra/Dockerfile.backend, target: api}
    mem_limit: 256m
    cpus: 0.5
    environment: *backend-env
    command: [uvicorn, backend.app.main:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-proxy-headers, --no-access-log, --limit-concurrency, "64", --backlog, "64", --timeout-keep-alive, "5"]
    networks: [edge, data]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, infra.container_probe]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *runtime
    image: mlchess-worker:${MLCHESS_IMAGE_TAG:?Required}
    build: {context: .., dockerfile: infra/Dockerfile.backend, target: worker}
    mem_limit: 512m
    cpus: 0.6
    environment: *backend-env
    networks: [data]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, infra.container_probe, worker]
      interval: 15s
      timeout: 5s
      retries: 4
  web:
    <<: *runtime
    image: mlchess-web:${MLCHESS_IMAGE_TAG:?Required}
    build: {context: .., dockerfile: infra/Dockerfile.web, target: static}
    mem_limit: 64m
    cpus: 0.1
    tmpfs:
      - /config:uid=10001,gid=10001,size=8m
      - /data:uid=10001,gid=10001,size=8m
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 12
  gateway:
    <<: *runtime
    image: mlchess-gateway:${MLCHESS_IMAGE_TAG:?Required}
    build: {context: .., dockerfile: infra/Dockerfile.gateway}
    mem_limit: 128m
    cpus: 0.2
    ports: ["80:8080", "443:8443", "443:8443/udp"]
    environment:
      MLCHESS_SITE_ADDRESS: ${MLCHESS_SITE_ADDRESS:?Required}
    volumes: [tls_data:/data, tls_config:/config]
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
networks:
  edge:
    ipam:
      config: [{subnet: "${MLCHESS_EDGE_SUBNET:-172.30.240.0/24}"}]
  data:
    internal: true
    ipam:
      config: [{subnet: "${MLCHESS_DATA_SUBNET:-172.30.241.0/24}"}]
volumes:
  postgres_data:
  redis_data:
  tls_data:
  tls_config:
