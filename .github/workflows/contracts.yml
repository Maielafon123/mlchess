name: Contracts

on:
  pull_request:
  push:
    branches: [main, 'a/**']

permissions:
  contents: read

jobs:
  common-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: python -m pip install -r contracts/requirements.txt
      - run: python contracts/validate.py
      - run: python -m pytest backend/tests -q
      - run: ruff check backend contracts/validate.py
      - run: ruff format --check backend contracts/validate.py

  legacy-regression:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest==9.0.2 chess==1.11.2 numpy==2.4.2 zstandard==0.25.0
      - run: python -m pytest tests -q
