name: Contracts

on:
  pull_request:
  push:
    branches: [main, 'a/**', 'codex/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            contracts/requirements.lock
            backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: python -m pip install -r contracts/requirements.txt
      - run: python -m pip install -c backend/requirements.lock -e "./backend[dev]"
      - run: npm --prefix contracts ci --ignore-scripts --no-audit --no-fund
      - run: python contracts/validate.py
      - run: python -m contracts.tooling.generate --check
      - run: python -m contracts.tooling.compatibility --base-ref "$CONTRACT_BASE_REF"
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm --prefix contracts run typecheck
      - run: npm --prefix contracts test
      - run: python -m pytest backend/tests -q
      - run: ruff check backend contracts
      - run: ruff format --check backend contracts

  legacy-regression:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest==9.0.2 chess==1.11.2 numpy==2.4.2 zstandard==0.25.0
      - run: python -m pytest tests -q

  web-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web run lint
      - run: pnpm --dir apps/web run build
      - run: pnpm --dir apps/web run test
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web run test:e2e

  database-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mlchess
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: mlchess
        options: >-
          --health-cmd "pg_isready -U mlchess"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c backend/requirements.lock -e "./backend[dev]"
      - run: python -m infra.recovery_drill --container "$POSTGRES_CONTAINER" --user mlchess
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
