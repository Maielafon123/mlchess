components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mlchess_session
      description: Opaque server-side account or limited guest session. Cookie naming is subject to auth
        configuration review.
  schemas:
    AcceptInvitationV1:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    AnalysisFactsV1:
      type: object
      additionalProperties: false
      required:
      - checks
      - captures
      - material_delta
      - motifs_verified
      - verified_claims
      properties:
        checks:
          type: boolean
        captures:
          type: boolean
        material_delta:
          type: integer
        motifs_verified:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - checkmate
            - promotion
            - en_passant
            - castling
        verified_claims:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/VerifiedClaimV1'
      description: checks/captures describe the played move. material_delta is material gained by the
        mover on this move using pawn=100, knight=320, bishop=330, rook=500, queen=900; it is not an engine
        evaluation. Motifs are limited to facts the v1 verifier can prove.
    AnalysisJobV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - id
      - game_id
      - revision
      - ply
      - position_key
      - status
      - analysis_id
      - error
      - created_at
      - updated_at
      properties:
        schema_version:
          type: integer
          const: 1
        id:
          $ref: '#/components/schemas/UUIDv4'
        game_id:
          $ref: '#/components/schemas/UUIDv4'
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        ply:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        position_key:
          type: string
          pattern: ^[0-9a-f]{64}$
        status:
          type: string
          enum:
          - pending
          - running
          - done
          - failed
        analysis_id:
          oneOf:
          - $ref: '#/components/schemas/UUIDv4'
          - type: 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/ProblemDetailsV1'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
        updated_at:
          $ref: '#/components/schemas/UTCDateTime'
      allOf:
      - if:
          properties:
            status:
              type: string
              enum:
              - pending
              - running
          required:
          - status
        then:
          properties:
            analysis_id:
              type: 'null'
            error:
              type: 'null'
      - if:
          properties:
            status:
              const: done
          required:
          - status
        then:
          properties:
            analysis_id:
              $ref: '#/components/schemas/UUIDv4'
            error:
              type: 'null'
      - if:
          properties:
            status:
              const: failed
          required:
          - status
        then:
          properties:
            analysis_id:
              type: 'null'
            error:
              $ref: '#/components/schemas/ProblemDetailsV1'
      description: Postgres durable job snapshot; Redis enqueue is not completion. Every worker/result
        read repeats participant, phase, revision and position_key checks. A stale result cannot become
        current.
    AnalysisReadyEventV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - event_id
      - game_id
      - seq
      - type
      - occurred_at
      - payload
      properties:
        schema_version:
          type: integer
          const: 1
        event_id:
          $ref: '#/components/schemas/UUIDv4'
        game_id:
          $ref: '#/components/schemas/UUIDv4'
        seq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        type:
          type: string
          const: analysis.ready
        occurred_at:
          $ref: '#/components/schemas/UTCDateTime'
        payload:
          type: object
          additionalProperties: false
          required:
          - analysis_id
          - revision
          - ply
          properties:
            analysis_id:
              $ref: '#/components/schemas/UUIDv4'
            revision:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            ply:
              type: integer
              minimum: 1
              maximum: 9007199254740991
      description: 'Durable event: seq is allocated atomically with game state/outbox. Publish only after
        commit.'
    AnalysisRequestV1:
      type: object
      additionalProperties: false
      required:
      - ply
      - analysis_level
      properties:
        ply:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        analysis_level:
          type: string
          enum:
          - quick
          - deep
      description: Participant-scoped analysis of a server-reconstructed move. Idempotency-Key UUIDv4
        header required; no client FEN, scores, engine paths or free resource budgets. Server captures
        revision/position_key when accepting the request.
    AnalysisResultV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - analysis_id
      - game_id
      - revision
      - ply
      - position_key
      - before_fen
      - after_fen
      - played_move_uci
      - best_move_uci
      - top_moves
      - score_before
      - score_after
      - quality
      - quality_method
      - cp_loss
      - engine
      - facts
      - created_at
      properties:
        schema_version:
          type: integer
          const: 1
        analysis_id:
          $ref: '#/components/schemas/UUIDv4'
        game_id:
          $ref: '#/components/schemas/UUIDv4'
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        ply:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        position_key:
          type: string
          pattern: ^[0-9a-f]{64}$
        before_fen:
          $ref: '#/components/schemas/FenV1'
        after_fen:
          $ref: '#/components/schemas/FenV1'
        played_move_uci:
          $ref: '#/components/schemas/UciMoveV1'
        best_move_uci:
          $ref: '#/components/schemas/UciMoveV1'
        top_moves:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/TopMoveV1'
        score_before:
          $ref: '#/components/schemas/ScoreV1'
        score_after:
          $ref: '#/components/schemas/ScoreV1'
        quality:
          type: string
          enum:
          - best
          - good
          - inaccuracy
          - mistake
          - blunder
          - unclassified
        quality_method:
          type: string
          enum:
          - cp-loss-v1
          - mate-score-v1
        cp_loss:
          oneOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        engine:
          $ref: '#/components/schemas/EngineMetadataV1'
        facts:
          $ref: '#/components/schemas/AnalysisFactsV1'
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
      allOf:
      - if:
          anyOf:
          - properties:
              score_before:
                properties:
                  kind:
                    const: mate
                required:
                - kind
          - properties:
              score_after:
                properties:
                  kind:
                    const: mate
                required:
                - kind
        then:
          properties:
            cp_loss:
              type: 'null'
            quality_method:
              const: mate-score-v1
        else:
          properties:
            cp_loss:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            quality_method:
              const: cp-loss-v1
      description: Engine facts only; no coach prose. position_key = sha256(before_fen + "|" + played_move_uci).
        Replay the played move to after_fen and each candidate PV from before_fen. cp_loss = max(0, (score_before.value
        - score_after.value) * (1 for a white mover, -1 for black)), only when both scores are cp. No
        public arbitrary-FEN endpoint.
    CapabilitiesV1:
      type: object
      additionalProperties: false
      required:
      - can_move
      - can_takeback
      - can_analyze_now
      properties:
        can_move:
          type: boolean
        can_takeback:
          type: boolean
        can_analyze_now:
          type: boolean
      description: Server-computed, viewer-specific permissions; not an authorization credential.
    ClockV1:
      type: object
      additionalProperties: false
      required:
      - white_remaining_ms
      - black_remaining_ms
      - running_side
      - server_now
      properties:
        white_remaining_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        black_remaining_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        running_side:
          oneOf:
          - $ref: '#/components/schemas/SideV1'
          - type: 'null'
        server_now:
          $ref: '#/components/schemas/UTCDateTime'
    CoachExplanationV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - game_id
      - revision
      - ply
      - analysis_id
      - language
      - level
      - summary
      - why
      - question
      - referenced_uci
      - highlight_squares
      - claim_refs
      - template_id
      - confidence
      - model_id
      - prompt_version
      - fallback_used
      properties:
        schema_version:
          const: 1
        game_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        ply:
          type: integer
          minimum: 1
        analysis_id:
          type: string
          format: uuid
        language:
          type: string
          enum:
          - ru
          - en
        level:
          type: string
          enum:
          - short
          - detailed
          - observation
          - direction
          - idea
          - candidates
          - solution
        summary:
          type: string
          minLength: 1
          maxLength: 500
        why:
          type: string
          minLength: 1
          maxLength: 2000
        question:
          type: string
          minLength: 1
          maxLength: 500
        referenced_uci:
          type: array
          items:
            type: string
            pattern: ^[a-h][1-8][a-h][1-8][qrbn]?$
          maxItems: 8
          uniqueItems: true
        highlight_squares:
          type: array
          items:
            type: string
            pattern: ^[a-h][1-8]$
          maxItems: 16
          uniqueItems: true
        claim_refs:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9._:-]+$
          maxItems: 16
          uniqueItems: true
        template_id:
          type: string
          pattern: ^[a-zA-Z0-9._:-]+$
          maxLength: 120
        confidence:
          type: string
          enum:
          - grounded
          - uncertain
          - fallback
        model_id:
          type: string
          minLength: 1
          maxLength: 160
        prompt_version:
          type: string
          pattern: ^[a-zA-Z0-9._:-]+$
          maxLength: 80
        fallback_used:
          type: boolean
    CoachJobV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - job_id
      - status
      - game_id
      - analysis_id
      - revision
      - ply
      properties:
