      - game_id
      - seq
      - type
      - occurred_at
      - payload
      properties:
        schema_version:
          type: integer
          const: 1
        event_id:
          $ref: '#/components/schemas/UUIDv4'
        game_id:
          $ref: '#/components/schemas/UUIDv4'
        seq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        type:
