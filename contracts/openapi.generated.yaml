          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - ready
          - failed
        game_id:
          type: string
          format: uuid
        analysis_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        ply:
          type: integer
          minimum: 1
        explanation:
          $ref: '#/components/schemas/CoachExplanationV1'
        error_code:
          type: string
          pattern: ^[A-Z0-9_:-]+$
          maxLength: 80
      allOf:
