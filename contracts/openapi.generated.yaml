    MoveAcceptedV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - client_move_id
      - move
      - snapshot
      properties:
        schema_version:
          type: integer
          const: 1
        client_move_id:
          $ref: '#/components/schemas/UUIDv4'
        move:
          $ref: '#/components/schemas/MoveV1'
        snapshot:
          $ref: '#/components/schemas/GameSnapshotV1'
      description: Persisted response returned identically on retry with the same actor/client_move_id
        and payload. snapshot.version = expected_version + 1. The move equals the last snapshot.moves
        item. Reuse with another payload gives 409 IDEMPOTENCY_CONFLICT.
    MoveV1:
      type: object
      additionalProperties: false
      required:
      - ply
      - uci
      - san
      properties:
        ply:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        uci:
          $ref: '#/components/schemas/UciMoveV1'
        san:
          type: string
          minLength: 1
          maxLength: 16
    PlayerV1:
      type: object
      additionalProperties: false
      required:
      - side
      - kind
      - user_id
      properties:
        side:
          $ref: '#/components/schemas/SideV1'
        kind:
          type: string
          enum:
          - human
          - engine
        user_id:
          oneOf:
          - $ref: '#/components/schemas/UUIDv4'
          - type: 'null'
      allOf:
      - if:
          properties:
            kind:
              const: human
          required:
          - kind
        then:
          properties:
            user_id:
              $ref: '#/components/schemas/UUIDv4'
      - if:
          properties:
            kind:
              const: engine
          required:
          - kind
        then:
          properties:
            user_id:
              type: 'null'
    ProblemDetailsV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - type
      - title
      - status
      - code
      - detail
      - request_id
      properties:
        schema_version:
          type: integer
          const: 1
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
          - 405
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - STALE_GAME_VERSION
          - IDEMPOTENCY_CONFLICT
          - NOT_YOUR_TURN
          - GAME_NOT_ACTIVE
          - DRAW_NOT_CLAIMABLE
          - ILLEGAL_MOVE
          - VALIDATION_ERROR
          - RATE_LIMITED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - METHOD_NOT_ALLOWED
        detail:
          type: string
          maxLength: 1000
        request_id:
          $ref: '#/components/schemas/UUIDv4'
      allOf:
      - if:
          properties:
            code:
              type: string
              enum:
              - BAD_REQUEST
          required:
          - code
        then:
          properties:
            status:
              const: 400
      - if:
          properties:
            code:
              type: string
              enum:
              - UNAUTHENTICATED
          required:
          - code
        then:
          properties:
            status:
              const: 401
      - if:
          properties:
            code:
              type: string
              enum:
              - FORBIDDEN
          required:
          - code
        then:
          properties:
            status:
              const: 403
      - if:
          properties:
            code:
              type: string
              enum:
              - NOT_FOUND
          required:
          - code
        then:
          properties:
            status:
              const: 404
      - if:
          properties:
            code:
              type: string
              enum:
              - STALE_GAME_VERSION
              - IDEMPOTENCY_CONFLICT
              - NOT_YOUR_TURN
              - GAME_NOT_ACTIVE
              - DRAW_NOT_CLAIMABLE
          required:
          - code
        then:
          properties:
            status:
              const: 409
      - if:
          properties:
            code:
              type: string
              enum:
              - ILLEGAL_MOVE
              - VALIDATION_ERROR
          required:
          - code
        then:
          properties:
            status:
              const: 422
      - if:
          properties:
            code:
              type: string
              enum:
              - RATE_LIMITED
          required:
          - code
        then:
          properties:
            status:
              const: 429
      - if:
          properties:
            code:
              type: string
              enum:
              - SERVICE_UNAVAILABLE
          required:
          - code
        then:
          properties:
            status:
              const: 503
      - if:
          properties:
            code:
              const: INTERNAL_ERROR
          required:
          - code
        then:
          properties:
            status:
              const: 500
      - if:
          properties:
            code:
              const: METHOD_NOT_ALLOWED
          required:
          - code
        then:
          properties:
            status:
              const: 405
    PuzzleAttemptRequestV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - learning_epoch
      - attempt_id
      - uci
      - expected_ply
      - session_number
      properties:
        schema_version:
          type: integer
          const: 1
        learning_epoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        attempt_id:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[A-Za-z0-9._:-]+$
        uci:
          $ref: '#/components/schemas/UciMoveV1'
        expected_ply:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        session_number:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    PuzzleAttemptV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - attempt_id
      - result
      - completed
      - next_ply
      properties:
        schema_version:
          const: 1
        attempt_id:
          type: string
          minLength: 1
          maxLength: 120
        result:
          type: string
          enum:
          - correct
          - incorrect
          - illegal
          - completed
        completed:
          type: boolean
        next_ply:
          type: integer
          minimum: 0
    PuzzleHintV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - puzzle_id
      - session_number
      - hint_index
      - text
      - has_more
      properties:
        schema_version:
          type: integer
          const: 1
        puzzle_id:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[a-z0-9-]+$
        session_number:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        hint_index:
          type: integer
          minimum: 1
          maximum: 3
        text:
          type: string
          minLength: 1
          maxLength: 500
