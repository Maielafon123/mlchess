          const: coach.ready
        occurred_at:
          $ref: '#/components/schemas/UTCDateTime'
        payload:
          type: object
          additionalProperties: false
          required:
          - explanation_id
          - analysis_id
          - revision
          - ply
          properties:
            explanation_id:
              $ref: '#/components/schemas/UUIDv4'
            analysis_id:
              $ref: '#/components/schemas/UUIDv4'
            revision:
              type: integer
