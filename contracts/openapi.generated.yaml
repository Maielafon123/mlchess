        occurred_at:
          $ref: '#/components/schemas/UTCDateTime'
        payload:
          $ref: '#/components/schemas/GameSnapshotV1'
      description: 'Control frame: seq is the current committed game cursor; does not allocate a durable
        event sequence.'
    GameSnapshotV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - id
      - mode
      - status
      - version
      - revision
      - fen
      - ply
      - side_to_move
      - players
      - moves
      - time_control
      - clock
      - capabilities
      - result
      - termination
      properties:
        schema_version:
          type: integer
          const: 1
        id:
          $ref: '#/components/schemas/UUIDv4'
        mode:
          $ref: '#/components/schemas/GameModeV1'
        status:
          $ref: '#/components/schemas/GameStatusV1'
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        fen:
          $ref: '#/components/schemas/FenV1'
        ply:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        side_to_move:
          $ref: '#/components/schemas/SideV1'
        players:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/PlayerV1'
          allOf:
          - contains:
              properties:
                side:
                  const: white
              required:
              - side
            minContains: 0
            maxContains: 1
          - contains:
              properties:
                side:
                  const: black
              required:
              - side
            minContains: 0
            maxContains: 1
        moves:
          type: array
          items:
            $ref: '#/components/schemas/MoveV1'
        time_control:
          oneOf:
          - $ref: '#/components/schemas/TimeControlV1'
          - type: 'null'
        clock:
          oneOf:
          - $ref: '#/components/schemas/ClockV1'
          - type: 'null'
        capabilities:
          $ref: '#/components/schemas/CapabilitiesV1'
        result:
          oneOf:
          - type: string
            enum:
            - white
            - black
            - draw
          - type: 'null'
        termination:
          oneOf:
          - type: string
            enum:
            - checkmate
            - stalemate
            - insufficient_material
            - fivefold_repetition
            - seventyfive_moves
            - threefold_claim
            - fifty_moves_claim
            - draw_agreement
            - resignation
            - timeout
            - aborted
          - type: 'null'
      allOf:
      - if:
          properties:
            status:
              type: string
              enum:
              - waiting
              - active
              - aborted
          required:
          - status
        then:
          properties:
            result:
              type: 'null'
      - if:
          properties:
            status:
              type: string
              enum:
              - waiting
              - active
          required:
          - status
        then:
          properties:
            termination:
              type: 'null'
      - if:
          properties:
            status:
              const: finished
          required:
          - status
        then:
          properties:
            result:
              type: string
              enum:
              - white
              - black
              - draw
            termination:
              type: string
              enum:
              - checkmate
              - stalemate
              - insufficient_material
              - fivefold_repetition
              - seventyfive_moves
              - threefold_claim
              - fifty_moves_claim
              - draw_agreement
              - resignation
              - timeout
      - if:
          properties:
            status:
              const: aborted
          required:
          - status
        then:
          properties:
            termination:
              const: aborted
      - if:
          properties:
            status:
              type: string
              enum:
              - waiting
              - finished
              - aborted
          required:
          - status
        then:
          properties:
            capabilities:
              properties:
                can_move:
                  const: false
            clock:
              oneOf:
              - type: 'null'
              - type: object
                properties:
                  running_side:
                    type: 'null'
      - if:
          properties:
            status:
              const: active
          required:
          - status
        then:
          properties:
            players:
              minItems: 2
      - if:
          properties:
            mode:
              const: rated
          required:
          - mode
        then:
          properties:
            time_control:
              $ref: '#/components/schemas/TimeControlV1'
            clock:
              $ref: '#/components/schemas/ClockV1'
      - if:
          properties:
            mode:
              type: string
              enum:
              - friend
              - rated
          required:
          - mode
        then:
          properties:
            capabilities:
              properties:
                can_takeback:
                  const: false
            players:
              items:
                properties:
                  kind:
                    const: human
      - if:
          properties:
            mode:
              type: string
              enum:
              - friend
              - rated
            status:
              type: string
              enum:
              - waiting
              - active
          required:
          - mode
          - status
        then:
          properties:
            capabilities:
              properties:
                can_analyze_now:
                  const: false
      - if:
          properties:
            time_control:
              type: 'null'
          required:
          - time_control
        then:
          properties:
            clock:
              type: 'null'
      - if:
          properties:
            time_control:
              type: object
          required:
          - time_control
        then:
          properties:
            clock:
              $ref: '#/components/schemas/ClockV1'
      - if:
          properties:
            mode:
              enum:
              - ai
              - coach
          required:
          - mode
        then:
          properties:
            players:
              minItems: 2
              allOf:
              - contains:
                  properties:
                    kind:
                      const: human
                  required:
                  - kind
                minContains: 1
                maxContains: 1
              - contains:
                  properties:
                    kind:
                      const: engine
                  required:
                  - kind
                minContains: 1
                maxContains: 1
      - if:
          properties:
            status:
              const: active
            side_to_move:
              const: white
          required:
          - status
          - side_to_move
        then:
          properties:
            clock:
              oneOf:
              - type: 'null'
              - type: object
                properties:
                  running_side:
                    const: white
      - if:
          properties:
            status:
              const: active
            side_to_move:
              const: black
          required:
          - status
          - side_to_move
        then:
          properties:
            clock:
              oneOf:
              - type: 'null'
              - type: object
                properties:
                  running_side:
                    const: black
      description: Full current branch, from the standard initial position. version changes per accepted
        command; revision changes on takeback. moves are contiguous and replay to fen/ply/side_to_move.
        Old branches remain in server audit storage. Permissions depend on requesting actor.
    GameStatusChangedEventV1:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - event_id
      - game_id
      - seq
      - type
      - occurred_at
      - payload
      properties:
        schema_version:
          type: integer
          const: 1
        event_id:
          $ref: '#/components/schemas/UUIDv4'
        game_id:
          $ref: '#/components/schemas/UUIDv4'
        seq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        type:
          type: string
          const: game.status_changed
        occurred_at:
          $ref: '#/components/schemas/UTCDateTime'
        payload:
          type: object
          additionalProperties: false
          required:
          - version
          - revision
          - status
          - result
          - termination
          - clock
          properties:
            version:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            revision:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            status:
              $ref: '#/components/schemas/GameStatusV1'
            result:
              oneOf:
              - type: string
                enum:
                - white
                - black
                - draw
              - type: 'null'
            termination:
              oneOf:
              - type: string
                enum:
                - checkmate
                - stalemate
                - insufficient_material
                - fivefold_repetition
                - seventyfive_moves
                - threefold_claim
                - fifty_moves_claim
                - draw_agreement
                - resignation
                - timeout
                - aborted
              - type: 'null'
            clock:
              oneOf:
              - $ref: '#/components/schemas/ClockV1'
              - type: 'null'
          allOf:
          - if:
              properties:
                status:
                  type: string
                  enum:
                  - waiting
                  - active
              required:
              - status
            then:
              properties:
                result:
                  type: 'null'
                termination:
                  type: 'null'
          - if:
              properties:
                status:
                  const: finished
              required:
              - status
            then:
              properties:
                result:
                  type: string
                  enum:
                  - white
                  - black
                  - draw
                termination:
                  type: string
                  not:
                    const: aborted
          - if:
              properties:
                status:
                  const: aborted
              required:
              - status
            then:
              properties:
                result:
                  type: 'null'
                termination:
                  const: aborted
          - if:
              properties:
                status:
                  type: string
                  enum:
                  - waiting
                  - finished
                  - aborted
              required:
              - status
            then:
              properties:
                clock:
                  oneOf:
                  - type: 'null'
                  - type: object
                    properties:
                      running_side:
                        type: 'null'
      description: 'Durable event: seq is allocated atomically with game state/outbox. Publish only after
        commit.'
