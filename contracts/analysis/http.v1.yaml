      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: https://mlchess.local/contracts/analysis/v1.yaml#/$defs/AnalysisRequestV1
