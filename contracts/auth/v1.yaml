$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mlchess.local/contracts/auth/v1.yaml
title: MLChess account sign-in v1
$defs:
  AuthProvidersV1:
    type: object
    additionalProperties: false
    required: [schema_version, google]
    properties:
      schema_version: {type: integer, const: 1}
      google: {type: boolean}
  GoogleLoginStartV1:
    type: object
    additionalProperties: false
    required: [schema_version, authorization_url]
    properties:
      schema_version: {type: integer, const: 1}
      authorization_url:
        type: string
        format: uri
        maxLength: 2048
        pattern: '^https://accounts\.google\.com/o/oauth2/v2/auth\?'
