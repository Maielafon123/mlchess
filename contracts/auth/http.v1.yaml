paths:
  /api/v1/auth/providers:
    get:
      operationId: authProviders
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Available account sign-in providers.
          content:
            application/json:
              schema:
                $ref: https://mlchess.local/contracts/auth/v1.yaml#/$defs/AuthProvidersV1
  /api/v1/auth/oidc/start:
    post:
      operationId: startGoogleLogin
      x-implementation-status: implemented
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Begin Google sign-in with the current browser session.
          content:
            application/json:
              schema:
                $ref: https://mlchess.local/contracts/auth/v1.yaml#/$defs/GoogleLoginStartV1
        '401':
          description: No active browser session.
          content: &problem
            application/problem+json:
              schema:
                $ref: https://mlchess.local/contracts/common/v1.yaml#/$defs/ProblemDetailsV1
        '403':
          description: Invalid origin or CSRF token.
          content: *problem
        '404':
          description: Google sign-in is not configured.
          content: *problem
        '429':
          description: Login rate limit exceeded.
          content: *problem
  /api/v1/auth/oidc/callback:
    get:
      operationId: finishGoogleLogin
      x-implementation-status: implemented
      responses:
        '303':
          description: Same-origin redirect after consuming a browser-bound login attempt.
          headers:
            Location:
              required: true
              schema:
                type: string
                enum: ['/play', '/play?auth=google-failed']
        '404':
          description: Google sign-in is not configured.
          content: *problem
