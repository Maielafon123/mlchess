$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mlchess.local/contracts/game/subscription.v1.yaml
$defs:
  GameSubscribeV1:
    type: object
    additionalProperties: false
    required: [type, game_id, after_seq]
    properties:
      type:
        type: string
        const: subscribe
      game_id:
        $ref: https://mlchess.local/contracts/common/v1.yaml#/$defs/UUIDv4
      after_seq:
        type: integer
        minimum: 0
        maximum: 9007199254740991
