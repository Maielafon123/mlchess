$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mlchess.local/contracts/learning/v1.yaml
$defs:
  LessonV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - id
    - title
    - summary
    - body
    - language
    - status
    - source_name
    - source_url
    - license
    - tags
    properties:
      schema_version:
        const: 1
      id:
        type: string
        pattern: ^[a-z0-9-]+$
      title:
        type: string
        minLength: 1
        maxLength: 200
      summary:
        type: string
        maxLength: 500
      body:
        type: string
        maxLength: 10000
      language:
        type: string
        enum:
        - ru
        - en
      status:
        type: string
        enum:
        - not-started
        - started
        - completed
      source_name:
        type: string
        maxLength: 200
      source_url:
        type: string
        format: uri
        pattern: ^https://
      license:
        type: string
        maxLength: 120
      tags:
        type: array
        items:
          type: string
          maxLength: 80
        maxItems: 16
  PuzzleV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - id
    - fen
    - difficulty
    - tags
    - source_name
    - source_url
    - license
    properties:
      schema_version:
        const: 1
      id:
        type: string
        minLength: 1
        maxLength: 160
      fen:
        type: string
        minLength: 1
        maxLength: 120
      difficulty:
        type: integer
        minimum: 1
        maximum: 5
      tags:
        type: array
        items:
          type: string
          maxLength: 80
        maxItems: 16
      source_name:
        type: string
        maxLength: 200
      source_url:
        type: string
        format: uri
        pattern: ^https://
      license:
        type: string
        maxLength: 120
  PuzzleAttemptV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - attempt_id
    - result
    - completed
    - next_ply
    properties:
      schema_version:
        const: 1
      attempt_id:
        type: string
        minLength: 1
        maxLength: 120
      result:
        type: string
        enum:
        - correct
        - incorrect
        - illegal
        - completed
      completed:
        type: boolean
      next_ply:
        type: integer
        minimum: 0
  StudentProgressV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - student_id
    - skills
    properties:
      schema_version:
        const: 1
      student_id:
        type: string
        minLength: 1
        maxLength: 120
      skills:
        type: array
        maxItems: 100
        items:
          type: object
          additionalProperties: false
          required:
          - skill
          - attempts
          - correct
          - hints_used
          - streak
          - due_at
          properties:
            skill:
              type: string
              maxLength: 80
            attempts:
              type: integer
              minimum: 0
            correct:
              type: integer
              minimum: 0
            hints_used:
              type: integer
              minimum: 0
            streak:
              type: integer
              minimum: 0
            due_at:
              type:
              - string
              - 'null'
              format: date-time
  LearningContextV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - learning_epoch
    properties:
      schema_version: &id001
        type: integer
        const: 1
      learning_epoch:
        type: integer
        minimum: 0
        maximum: 9007199254740991
  LessonListV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - learning_epoch
    - items
    - page
    - total_pages
    properties:
      schema_version: *id001
      learning_epoch:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      items:
        type: array
        items:
          $ref: https://mlchess.local/contracts/learning/v1.yaml#/$defs/LessonV1
        maxItems: 24
      page:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      total_pages:
        type: integer
        minimum: 1
        maximum: 9007199254740991
  LessonStatusRequestV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - learning_epoch
    - status
    properties:
      schema_version: *id001
      learning_epoch:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      status:
        type: string
        enum:
        - started
        - completed
  PuzzleListV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - items
    properties:
      schema_version: *id001
      items:
        type: array
        items:
          $ref: https://mlchess.local/contracts/learning/v1.yaml#/$defs/PuzzleV1
        maxItems: 100
  PuzzleAttemptRequestV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - learning_epoch
    - attempt_id
    - uci
    - expected_ply
    - session_number
    properties:
      schema_version: *id001
      learning_epoch:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      attempt_id: &id004
        type: string
        minLength: 1
        maxLength: 120
        pattern: ^[A-Za-z0-9._:-]+$
      uci: &id002
        $ref: https://mlchess.local/contracts/game/v1.yaml#/$defs/UciMoveV1
      expected_ply:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      session_number:
        type: integer
        minimum: 0
        maximum: 9007199254740991
  PuzzleSessionRequestV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - learning_epoch
    - session_number
    properties:
      schema_version: *id001
      learning_epoch:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      session_number:
        type: integer
        minimum: 0
        maximum: 9007199254740991
  PuzzleHintV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - puzzle_id
    - session_number
    - hint_index
    - text
    - has_more
    properties:
      schema_version: *id001
      puzzle_id: &id003
        type: string
        minLength: 1
        maxLength: 80
        pattern: ^[a-z0-9-]+$
      session_number:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      hint_index:
        type: integer
        minimum: 1
        maximum: 3
      text:
        type: string
        minLength: 1
        maxLength: 500
      has_more:
        type: boolean
  PuzzleReplayMoveV1:
    type: object
    additionalProperties: false
    required:
    - uci
    - san
    - fen
    properties:
      uci: *id002
      san:
        type: string
        minLength: 1
        maxLength: 32
      fen:
        type: string
        minLength: 1
        maxLength: 120
  PuzzleStateV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - learning_epoch
    - puzzle_id
    - session_number
    - current_fen
    - next_ply
    - completed
    - hints
    properties:
      schema_version: *id001
      learning_epoch:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      puzzle_id: *id003
      session_number:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      current_fen:
        type: string
        minLength: 1
        maxLength: 120
      next_ply:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      completed:
        type: boolean
      hints:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 500
        maxItems: 3
      solution:
        type: array
        items:
          $ref: https://mlchess.local/contracts/learning/v1.yaml#/$defs/PuzzleReplayMoveV1
        maxItems: 128
    allOf:
    - if:
        properties:
          completed:
            const: false
        required:
        - completed
      then:
        not:
          required:
          - solution
    - if:
        properties:
          completed:
            const: true
        required:
        - completed
      then:
        required:
        - solution
  LearningResetV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - learning_epoch
    - confirm
    properties:
      schema_version: *id001
      learning_epoch:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      confirm:
        type: boolean
        const: true
  LearningExportAttemptV1:
    type: object
    additionalProperties: false
    required:
    - attempt_id
    - puzzle_id
    - uci
    - response
    - created_at
    properties:
      attempt_id: *id004
      puzzle_id: *id003
      uci: *id002
      response:
        $ref: https://mlchess.local/contracts/learning/v1.yaml#/$defs/PuzzleAttemptV1
      created_at:
        $ref: https://mlchess.local/contracts/common/v1.yaml#/$defs/UTCDateTime
  LearningExportV1:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - learning_epoch
    - student_id
    - progress
    - lessons
    - puzzles
    - attempts
    - next_cursor
    properties:
      schema_version: *id001
      learning_epoch:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      student_id:
        type: string
        minLength: 1
        maxLength: 120
      progress:
        $ref: https://mlchess.local/contracts/learning/v1.yaml#/$defs/StudentProgressV1
      lessons:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - lesson_id
          - status
          properties:
            lesson_id: *id003
            status:
              type: string
              enum:
              - started
              - completed
        maxItems: 1000
      puzzles:
        type: array
        items:
          $ref: https://mlchess.local/contracts/learning/v1.yaml#/$defs/PuzzleStateV1
        maxItems: 1000
      attempts:
        type: array
        items:
          $ref: https://mlchess.local/contracts/learning/v1.yaml#/$defs/LearningExportAttemptV1
        maxItems: 100
      next_cursor:
        type:
        - string
        - 'null'
        maxLength: 300
